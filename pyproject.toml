[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contracenador"
version = "0.1.0"
description = "Simulação local de agentes com estado, memória e interação privada"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
contracenador = "contracenador.cli.main:main"

[tool.setuptools.packages.find]
include = ["contracenador*"]